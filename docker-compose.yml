services:
  db:
    image: mysql:8.0
    command: --lower-case-table-names=1
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: empcondominio2
      MYSQL_USER: admin
      MYSQL_PASSWORD: Senha123
    volumes:
      - db_data:/var/lib/mysql
      - ./database/docker/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uadmin", "-pSenha123"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: empcondominio2
      DB_USER: admin
      DB_PASS: Senha123
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
